<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASR Academy – English Learning Hub 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--p:#4F46E5;--g:#10B981;--a:#F59E0B;--r:#EF4444;--v:#8B5CF6;--bg:#EEF2FF;--c:#fff;--t:#1e1b4b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:'Hind Siliguri','Noto Sans Bengali',Poppins,sans-serif;line-height:1.6}
header{background:linear-gradient(135deg,#064e3b,#4F46E5);color:#fff;padding:14px;display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center}
header img{width:78px;height:78px;border-radius:50%;background:#fff}header h1{margin:0;font-size:1.5rem}header p{margin:2px 0 0;color:#fde68a}
nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button,.btn{border:0;border-radius:999px;padding:9px 18px;font:600 1rem inherit;font-family:inherit;background:var(--c);color:var(--p);cursor:pointer;box-shadow:0 2px 6px #4f46e533}
nav button.on,.btn{background:var(--p);color:#fff}.btn.g{background:var(--g)}.btn.a{background:var(--a)}
main{max-width:900px;margin:auto;padding:10px 12px 40px}.card{background:var(--c);border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 4px 14px #4f46e522}
.card h3{margin:0 0 6px;color:var(--p)}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{flex:1;border:2px solid var(--v);background:#fff;color:var(--v);border-radius:12px;padding:8px;font:600 1rem inherit;font-family:inherit;cursor:pointer}.tabs button.on{background:var(--v);color:#fff}
.en{font-family:Poppins,sans-serif;font-weight:600}.sent{border-left:5px solid var(--a);padding:6px 10px;margin:8px 0;background:#fffbeb;border-radius:8px}
.rule{background:#ecfdf5;border:2px dashed var(--g);border-radius:12px;padding:10px;margin:10px 0}table{border-collapse:collapse;width:100%}td,th{border:1px solid #c7d2fe;padding:5px 8px}th{background:#e0e7ff}
.q{border:2px solid #e0e7ff;border-radius:12px;padding:10px;margin:10px 0}.q.ok{border-color:var(--g);background:#ecfdf5}.q.no{border-color:var(--r);background:#fef2f2}
.q input,.q select,textarea{width:100%;padding:8px;border:2px solid #c7d2fe;border-radius:10px;font:1rem Poppins,sans-serif;margin-top:6px}
.fb{margin-top:8px;padding:8px;border-radius:8px;background:#fee2e2;color:#7f1d1d}.fb.ok{background:#d1fae5;color:#064e3b}
.tag{display:inline-block;background:var(--v);color:#fff;border-radius:8px;padding:0 8px;font-size:.85rem}.pass{background:#f1f5f9;border-radius:10px;padding:10px;font-family:Poppins,sans-serif;font-size:.95rem}
.timer{position:sticky;top:60px;background:var(--a);color:#fff;padding:6px 12px;border-radius:12px;text-align:center;font-weight:700;z-index:4}
.chip{display:inline-block;padding:6px 12px;margin:3px;border-radius:999px;background:#e0e7ff;cursor:pointer;font-family:Poppins}.chip.on{background:var(--a);color:#fff}
.big{font-size:2.4rem;color:var(--p);font-weight:700}.hide{display:none}details{margin-top:6px}
@media print{header p,nav,.btn,.timer,.nores{display:none!important}body{background:#fff}.card{box-shadow:none}}
</style></head><body>

const LW={13:[L13,LT13('Write a letter to your younger brother advising him to use the tablet for only one hour a day (clues: tablet, eyes, sleep, family, outdoor games).',"Dear Rafi, I hope you are well. I have heard that you play on the tablet for many hours. Too much screen time hurts your eyes and spoils your sleep. Please use it for only one hour a day. Spend quality time with our family and play outdoor games with your friends. This will keep you healthy and happy. With love, your elder brother, Sumon")],
14:[LT13('Write a letter to your friend about Lipi, a girl who uses a wheelchair and won a chess competition (clues: Lipi, wheelchair, chess, classmates, Ms. Anita).',"Dear Mina, I hope you are fine. Today I want to tell you about Lipi, our classmate. She uses a wheelchair to move, but she never loses hope. Her classmates and Ms. Anita help her happily. Last month, she won a chess competition at school. She is a true champion and an inspiration to all of us. Please write back soon. Your friend, Rima"),LT13('Write a diary entry as Lipi on the day you won the chess competition.','10 March 2026, 9:00 PM. Dear Diary, Today was the happiest day of my life. I won the chess competition at school. My classmates clapped and Ms. Anita hugged me. I was a little nervous, but I never gave up. I use a wheelchair, but my dreams are big. One day, I want to be a teacher like Ms. Anita. Good night. Lipi')],
17:[LT13('Write a diary entry as a big green tree beside a busy city road, about air pollution and how you help people.','29 October 2026, 9:00 PM. Dear Diary, Today was tiring. Buses and trucks passed by me all day, blowing black smoke. Dust covered my leaves and many children were coughing. Still, I absorbed harmful gases and gave fresh oxygen. An old man rested under my shade and smiled. If people plant more trees and ride bicycles, our air will be clean again. Good night. A Caring City Tree'),LT13('Write a letter to your friend telling him/her how to reduce air pollution (clues: smoke, trees, bicycle, fossil fuels, asthma).',"Dear Arif, I hope you are well. Air pollution is a big problem in our cities. Smoke from vehicles and burning fossil fuels makes people sick with asthma. We should plant more trees because they absorb harmful gases and give oxygen. We can also walk or ride bicycles for short distances. Let us work together for clean air. Your friend, Sumon")]};
const CW={13:[CT('My Family Weekend (Quality Time Together) — ১০টি বাক্য','Every weekend, my family spends quality time together. We switch off our phones and tablets. My father tells us interesting stories. My mother cooks tasty food. We play carrom and talk about our week. Sometimes we go to the field to play football. These moments make our bond strong. We laugh a lot and feel very happy. I love my family weekend very much. It is the best part of my week.'),CT('Good and Bad Effects of Screen Time — ১০টি বাক্য','Screens are part of our life today. We can learn many new things from them. But too much screen time is harmful. It hurts our eyes and spoils our sleep. Children become grumpy and angry. They lose interest in study and outdoor games. So we should use screens only for a short time. We should talk to our family and play outside. A balanced life keeps us healthy and happy. Use technology wisely.')],
14:[L14,CT('My Class Teacher / A Helpful Classmate — ১০টি বাক্য','My class teacher is Ms. Anita. She is kind and caring. She teaches us with a smile. She helps every student, especially those who need extra care. She makes sure that everyone feels comfortable in the class. My classmates also help each other. We share books and play together. Because of our teacher, our class is like a family. I respect her very much. She is my inspiration.')],
17:[CT('Air Pollution — ১০টি বাক্য','Air pollution is a serious problem today. Smoke, dust and chemicals pollute our air. Burning fossil fuels like coal, oil and gas is a main cause. Polluted air makes people sick with asthma and other diseases. It also causes global warming. We should plant more trees to clean the air. We should walk or ride bicycles for short distances. Factories must control their smoke. Every small step helps. Let us save the air we share.'),CT('The Importance of Trees — ১০টি বাক্য','Trees are our best friends. They absorb harmful gases and give us fresh oxygen. They keep the air clean and healthy. Trees give us fruits, wood and cool shade. Their roots protect the soil from erosion. They also help to reduce global warming. Without trees, our planet would become unsafe. So we should plant more trees every year. We must never cut trees without reason. Let us love and protect trees.')]};
